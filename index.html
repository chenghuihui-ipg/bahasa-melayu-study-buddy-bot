<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Buddy Bot – Bahasa Melayu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      background: linear-gradient(135deg, #1a6fcf 0%, #0f4fa8 100%);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    .header-avatar {
      width: 44px; height: 44px;
      background: #fff;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .header-info h1 { font-size: 16px; font-weight: 700; }
    .header-info p  { font-size: 12px; opacity: .85; margin-top: 1px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #4ade80;
      display: inline-block;
      margin-right: 4px;
    }

    /* ── Chat container ── */
    .chat-wrapper {
      width: 100%;
      max-width: 700px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 0 80px;
    }

    #chat-log {
      flex: 1;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
      min-height: 0;
    }

    /* ── Messages ── */
    .msg { display: flex; gap: 8px; max-width: 88%; }
    .msg.bot  { align-self: flex-start; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: #1a6fcf;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .msg.user .msg-avatar { background: #6b7280; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot  .bubble { background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .msg.user .bubble { background: #1a6fcf; color: #fff; border-bottom-right-radius: 4px; }

    /* Markdown-ish formatting inside bubbles */
    .bubble strong { font-weight: 700; }
    .bubble em     { font-style: italic; }

    /* ── Quick-reply chips ── */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      padding: 4px 14px 0;
      align-self: flex-start;
      max-width: 700px;
      width: 100%;
    }
    .chip {
      background: #e8f0fe;
      color: #1a56db;
      border: 1px solid #c3d9fc;
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background .15s;
      white-space: nowrap;
    }
    .chip:hover { background: #c3d9fc; }

    /* ── Typing indicator ── */
    .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%;
      background: #9ca3af;
      animation: bounce .9s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .30s; }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

    /* ── Input bar ── */
    .input-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 10;
    }
    #user-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 100px;
      font-family: inherit;
      transition: border-color .2s;
    }
    #user-input:focus { border-color: #1a6fcf; }
    #send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #1a6fcf;
      color: #fff;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      transition: background .15s;
    }
    #send-btn:hover { background: #0f4fa8; }
    #send-btn:disabled { background: #9ca3af; cursor: default; }

    /* ── Info banner ── */
    .info-banner {
      font-size: 11px;
      color: #6b7280;
      text-align: center;
      padding: 6px 10px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    /* ── Quiz progress bar ── */
    .quiz-bar {
      display: none;
      background: #e8f0fe;
      padding: 6px 16px;
      font-size: 12px;
      color: #1a56db;
      gap: 8px;
      align-items: center;
    }
    .quiz-bar.active { display: flex; }
    .quiz-progress {
      height: 6px; flex: 1;
      background: #c3d9fc;
      border-radius: 3px;
      overflow: hidden;
    }
    .quiz-fill { height: 100%; background: #1a6fcf; border-radius: 3px; transition: width .3s; }

    @media (max-width: 720px) {
      .chat-wrapper { max-width: 100%; }
      .chips { max-width: 100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-avatar">📚</div>
  <div class="header-info">
    <h1>Study Buddy Bot – Bahasa Melayu</h1>
    <p><span class="status-dot"></span>Pembantu Pembelajaran Bahasa Melayu</p>
  </div>
</div>

<div class="info-banner">
  Direka untuk murid Tahun 1 – 6 &bull; Tiada LLM &bull; Penerangan, latihan &amp; kuiz tersedia
</div>

<div class="quiz-bar" id="quiz-bar">
  <span id="quiz-label">Kuiz: 0/5</span>
  <div class="quiz-progress"><div class="quiz-fill" id="quiz-fill" style="width:0%"></div></div>
  <span id="quiz-score">⭐ 0</span>
</div>

<div class="chat-wrapper">
  <div id="chat-log"></div>
</div>

<div class="chips" id="chips-bar"></div>

<div class="input-bar">
  <textarea id="user-input" rows="1" placeholder="Taip soalan atau topik Bahasa Melayu..." autocomplete="off"></textarea>
  <button id="send-btn" aria-label="Hantar">&#10148;</button>
</div>

<script src="brain.js"></script>

<script>
(function () {
  "use strict";

  let session = StudyBuddyBrain.createSession();

  const log      = document.getElementById("chat-log");
  const input    = document.getElementById("user-input");
  const sendBtn  = document.getElementById("send-btn");
  const chipsBar = document.getElementById("chips-bar");
  const quizBar  = document.getElementById("quiz-bar");
  const quizLabel= document.getElementById("quiz-label");
  const quizFill = document.getElementById("quiz-fill");
  const quizScore= document.getElementById("quiz-score");

  const CHIP_IDLE = [
    "Kata Nama", "Kata Kerja", "Kata Adjektif", "Kata Ganti Nama",
    "Binaan Ayat", "Kata Sendi Nama", "Kata Hubung", "Imbuhan",
    "Peribahasa", "Ejaan", "Kosa Kata", "Pemahaman",
  ];
  const CHIP_TOPIC = ["Contoh Lain", "Terangkan Lagi", "Latihan", "Kuiz", "Kenapa?", "Menu"];
  const CHIP_QUIZ  = ["A", "B", "C", "D", "Berhenti"];
  const CHIP_PRACTICE = ["Soalan Seterusnya", "Terangkan", "Berhenti"];

  function setChips(arr) {
    chipsBar.innerHTML = "";
    arr.forEach(label => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = label;
      btn.addEventListener("click", () => sendMessage(label));
      chipsBar.appendChild(btn);
    });
  }

  function renderBubble(text, from) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${from}`;

    const av = document.createElement("div");
    av.className = "msg-avatar";
    av.textContent = from === "bot" ? "🤖" : "👤";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = formatMarkdown(text);

    wrap.appendChild(av);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  function formatMarkdown(text) {
    text = text.replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>");
    text = text.replace(/_([^_\n]+)_/g, "<em>$1</em>");
    return text;
  }

  function showTyping() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typing-indicator";
    const av = document.createElement("div");
    av.className = "msg-avatar";
    av.textContent = "🤖";
    const dot = document.createElement("div");
    dot.className = "bubble typing";
    dot.innerHTML = "<span></span><span></span><span></span>";
    wrap.appendChild(av);
    wrap.appendChild(dot);
    log.appendChild(wrap);
    scrollBottom();
  }

  function hideTyping() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  function scrollBottom() {
    log.scrollTop = log.scrollHeight;
  }

  function updateQuizUI() {
    if (session.state === "quiz_active") {
      const q  = StudyBuddyBrain.QUIZZES[session.quizTopic];
      const total = q ? q.length : 5;
      const done  = session.quizIndex;
      quizLabel.textContent = `Kuiz: ${done}/${total}`;
      quizFill.style.width  = `${(done / total) * 100}%`;
      quizScore.textContent = `⭐ ${session.quizScore}`;
      quizBar.classList.add("active");
    } else {
      quizBar.classList.remove("active");
    }
  }

  function updatePracticeUI() {
    if (session.state === "practice_active") {
      const kb = StudyBuddyBrain.KB[session.topic];
      const total = kb ? kb.practice.length : 5;
      quizLabel.textContent = `Latihan: ${session.practiceIndex}/${total}`;
      quizFill.style.width  = `${(session.practiceIndex / total) * 100}%`;
      quizScore.textContent = `📝`;
      quizBar.classList.add("active");
    }
  }

  function sendMessage(text) {
    text = (text || input.value).trim();
    if (!text) return;

    renderBubble(text, "user");
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    showTyping();

    setTimeout(() => {
      hideTyping();
      const result = StudyBuddyBrain.processMessage(session, text);
      session = result.session;
      renderBubble(result.reply, "bot");
      updateQuizUI();
      updatePracticeUI();

      if (session.state === "quiz_active") {
        setChips(CHIP_QUIZ);
      } else if (session.state === "practice_active") {
        setChips(CHIP_PRACTICE);
      } else if (session.state === "topic_selected") {
        setChips(CHIP_TOPIC);
      } else {
        setChips(CHIP_IDLE);
      }

      sendBtn.disabled = false;
      input.focus();
    }, 400 + Math.random() * 200);
  }

  sendBtn.addEventListener("click", () => sendMessage());
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 100) + "px";
  });

  function boot() {
    setChips(CHIP_IDLE);
    setTimeout(() => {
      const welcome =
        "Hai! Selamat datang ke *Study Buddy Bot – Bahasa Melayu*! 😊\n\n" +
        "Saya di sini untuk membantu awak belajar Bahasa Melayu!\n\n" +
        "📚 *TOPIK YANG TERSEDIA:*\n" +
        "Kata Nama · Kata Kerja · Kata Adjektif · Kata Ganti Nama\n" +
        "Binaan Ayat · Kata Sendi Nama · Kata Hubung · Imbuhan\n" +
        "Peribahasa · Ejaan · Kosa Kata · Pemahaman · Tatabahasa\n\n" +
        "Taip *menu* untuk senarai penuh.\n\n" +
        "💡 *Contoh soalan yang boleh awak tanya:*\n" +
        "• \"Apa itu kata kerja?\"\n" +
        "• \"Boleh terangkan tentang kata kerja?\"\n" +
        "• \"Saya tak faham kata kerja.\"\n" +
        "• \"Apa beza kata nama dengan kata kerja?\"\n" +
        "• \"Bagi contoh lain.\"\n" +
        "• \"Boleh semak ayat saya?\"\n" +
        "• \"Latihan\" · \"Kuiz\" · \"Menu\"";
      renderBubble(welcome, "bot");
    }, 200);
  }

  boot();
})();
</script>

</body>
</html>
